<!DOCTYPE html>
<html>
<head>
    <title>TicTacToe</title>

    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
            margin-bottom: 20px;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>TicTacToe</h1>

<div class="board">
    <button onclick="makeMove(this, 0)"></button>
    <button onclick="makeMove(this, 1)"></button>
    <button onclick="makeMove(this, 2)"></button>

    <button onclick="makeMove(this, 3)"></button>
    <button onclick="makeMove(this, 4)"></button>
    <button onclick="makeMove(this, 5)"></button>

    <button onclick="makeMove(this, 6)"></button>
    <button onclick="makeMove(this, 7)"></button>
    <button onclick="makeMove(this, 8)"></button>
</div>

<button onclick="resetGame()">Reset Game</button>

<script>
    let currentPlayer = "X";

    let board = ["", "", "", "", "", "", "", "", ""];

    function makeMove(button, index) {
        if (board[index] !== "") return;

        board[index] = currentPlayer;
        button.innerText = currentPlayer;

        if (checkWinner()) {
            alert(currentPlayer + " wins!");
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
    }

    function checkWinner() {
        const wins = [
            [0,1,2],
            [3,4,5],
            [6,7,8],
            [0,3,6],
            [1,4,7],
            [2,5,8],
            [0,4,8],
            [2,4,6]
        ];

        for (let combo of wins) {
            let [a,b,c] = combo;

            if (
                board[a] !== "" &&
                board[a] === board[b] &&
                board[a] === board[c]
            ) {
                return true;
            }
        }

        return false;
    }

    function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        currentPlayer = "X";

        document.querySelectorAll(".board button").forEach(btn => {
            btn.innerText = "";
        });
    }
</script>

</body>
</html>
